<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa Clips - Authorization</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;line-height:1.6;color:#222}code{display:block;word-break:break-all;background:#f3f3f3;padding:.75rem;border-radius:6px}</style></head><body>
<h1>Casa Clips</h1>
<p id="msg">Waiting for TikTok authorization...</p>
<code id="code" hidden></code>
<p><a href="terms.html">Terms of Service</a> &middot; <a href="privacy.html">Privacy Policy</a></p>
<script>
// TikTok redirects here with ?code=...&state=... after the account owner authorizes the app.
// This page only displays the code locally in the browser; it is not stored or sent anywhere.
var p = new URLSearchParams(location.search), c = p.get('code'), e = p.get('error');
var msg = document.getElementById('msg'), box = document.getElementById('code');
if (c) { msg.textContent = 'Authorization successful. Copy this code into the Casa Clips agent:'; box.textContent = c; box.hidden = false; }
else if (e) { msg.textContent = 'Authorization failed: ' + e; }
</script></body></html>
